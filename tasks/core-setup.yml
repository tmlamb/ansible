- name: Install base-devel
  become: true
  community.general.pacman:
    name: ["base-devel"]
    state: latest
  tags:
    - install
    - neovim
    - core

- name: Install System Packages
  become: true
  community.general.pacman:
    name: [ "lua51", "luarocks", "unzip" ]
    state: latest
  tags:
    - install
    - neovim
    - core

- name: Install System Packages 2 (the rest)
  become: true
  community.general.pacman:
    name: [ "sway", "swaybg", "swayidle", "swaylock", "curl", "btop", "jq" ]
    state: latest
  tags:
    - install
    - core

- name: Install Fonts
  become: true
  community.general.pacman:
    name: [ "ttf-meslo-nerd", "noto-fonts", "noto-fonts-cjk", "noto-fonts-emoji", "noto-fonts-extra" ]
    state: latest
  tags:
    - install
    - core

- name: Terminal
  become: true
  community.general.pacman:
    name: [ "ghostty" ]
    state: latest
  tags:
    - install
    - core
