- name: Install packages
  become: true
  community.general.pacman:
    name: [ "tmux", "fzf", "gimp", "xclip", "tldr", "ripgrep", "keepassxc", "fd", "brightnessctl", "grim", "imv", "pipewire", "pipewire-audio", "pipewire-pulse" ]
    state: latest
  tags:
    - install
    - productivity

- name: Ensure screenshot directory exists.
  file:
    path: "{{ lookup('env', 'HOME') }}/screenshots"
    state: directory
  tags:
    - install
    - fonts
