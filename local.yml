- hosts: localhost
  gather_facts: yes
  vars:
    source_key: "./.ssh/id_rsa"
    dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
    personal: "{{ lookup('env', 'HOME') }}/personal"
  pre_tasks:
  - name: Update pacman cache
    become: true
    community.general.pacman:
      update_cache: true
    tags:
      - install
      - core
  - include_vars: user_vars.yml
  - debug: msg="Hello, {{ name }}!"
  tasks:
    - block:
      - include_tasks: tasks/ssh.yml
      - include_tasks: tasks/git-setup.yml
      - include_tasks: tasks/core-setup.yml
      - include_tasks: tasks/yay.yml
      - include_tasks: tasks/aur.yml
      - include_tasks: tasks/dropbox-setup.yml
      # - include_tasks: tasks/kubectl-setup.yml
      - include_tasks: tasks/productivity-tools.yml
      - include_tasks: tasks/docker.yml
      - include_tasks: tasks/personal-projects.yml
      - include_tasks: tasks/node-setup.yml
      - include_tasks: tasks/npm-packages.yml
      - include_tasks: tasks/zsh-setup.yml
      - include_tasks: tasks/nvim-setup.yml
      - include_tasks: tasks/dotfiles.yml
      - include_tasks: tasks/minecraft.yml
      - include_tasks: tasks/display-calibration.yml
      - include_tasks: tasks/scallion.yml
      # - include_tasks: tasks/golang.yml
